name: Feature request
description: Suggest something Copaste should do
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation in your city where the current tool falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How would you like it to work? Rough ideas are fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use today
      description: Optional. Another mod, a manual trick, or nothing.
